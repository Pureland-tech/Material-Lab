<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg: var(--figma-color-bg, #ffffff);
        --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
        --text: var(--figma-color-text, #1e1e1e);
        --text-2: var(--figma-color-text-secondary, #6b6b6b);
        --border: var(--figma-color-border, #e6e6e6);
        --accent: var(--figma-color-bg-brand, #0d99ff);
        --accent-text: var(--figma-color-text-onbrand, #ffffff);
        --danger: var(--figma-color-text-danger, #d32f2f);
        --warning-bg: var(--figma-color-bg-warning-tertiary, #fff4dc);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 11px/1.45 Inter, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
      }
      h1 {
        font-size: 13px;
        margin: 0;
      }
      .note {
        color: var(--text-2);
        margin: 0;
      }
      .callout {
        background: var(--bg-2);
        border-radius: 6px;
        padding: 8px;
      }
      .callout.warning {
        background: var(--warning-bg);
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: var(--text-2);
        font-weight: 500;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .row > * {
        flex: 1;
      }
      input,
      select,
      button {
        font: inherit;
        color: var(--text);
      }
      input[type='text'],
      input[type='number'],
      select {
        height: 28px;
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 0 6px;
        background: var(--bg);
        width: 100%;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--accent);
      }
      input[type='color'] {
        width: 100%;
        height: 26px;
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 1px;
        background: var(--bg);
      }
      button {
        height: 30px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        padding: 0 10px;
        cursor: pointer;
        font-weight: 600;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      canvas {
        width: 100%;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: repeating-conic-gradient(#e5e5e5 0 25%, #fff 0 50%) 0 0 / 12px 12px;
        display: block;
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      legend {
        color: var(--text-2);
        font-weight: 500;
        margin-bottom: 4px;
      }
      .radio {
        flex-direction: row;
        align-items: center;
        gap: 6px;
        color: var(--text);
        font-weight: 400;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .control-head {
        display: flex;
        justify-content: space-between;
      }
      #status {
        min-height: 16px;
      }
      #status.error {
        color: var(--danger);
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Material Lab</h1>
        <p class="note">Inserts a rendered image. Edit the recipe here or in the Material Lab web app — Figma keeps the image, not the shader layers.</p>
      </div>

      <div id="reference" class="callout hidden"></div>

      <div class="row">
        <label>
          Start from
          <select id="preset"></select>
        </label>
        <button id="import" type="button" title="Open a recipe JSON exported from the Material Lab web app">Open recipe…</button>
        <input id="file" type="file" accept=".json,application/json" class="hidden" />
      </div>

      <canvas id="preview" width="356" height="222" role="img" aria-label="Texture preview"></canvas>

      <div class="row">
        <label>
          Seed
          <input id="seed" type="text" inputmode="numeric" />
        </label>
        <button id="variation" type="button" title="New seed; every other setting stays the same">New variation</button>
      </div>

      <div id="controls" class="controls"></div>

      <div class="row">
        <label>
          Width
          <input id="width" type="number" min="16" max="4096" />
        </label>
        <label>
          Height
          <input id="height" type="number" min="16" max="4096" />
        </label>
        <label>
          Scale
          <select id="scale">
            <option value="1">1×</option>
            <option value="2">2×</option>
          </select>
        </label>
      </div>
      <p id="size-error" class="note hidden" style="color: var(--danger)"></p>

      <fieldset>
        <legend>Insert as</legend>
        <label class="radio"><input type="radio" name="mode" value="new" checked /> New rectangle at the center of the view</label>
        <label class="radio"><input type="radio" name="mode" value="fill" id="mode-fill" /> <span id="fill-label">Image fill on selected layers</span></label>
      </fieldset>

      <button id="insert" class="primary" type="button">Insert to canvas</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <!-- SCRIPT -->
  </body>
</html>
